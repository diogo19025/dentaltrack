packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Correções de segurança em dependências transitivas, sempre dentro da mesma
# major que o pacote de cima já aceita (auditoria de 2026-09-27).
overrides:
  hono@<4.12.25: ^4.12.25
  fast-uri@<3.1.6: ^3.1.6
  mysql2@<3.22.0: ^3.22.0
  browserslist@<4.28.7: ^4.28.7
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
